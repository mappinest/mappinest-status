name: Extra Site Schedule
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Static Site CI
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Static Site CI
          token: ${{ secrets.GH_PAT }}
